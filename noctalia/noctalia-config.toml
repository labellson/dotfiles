[nightlight]
enabled = true
temperature_night = 3800

[osd.kinds]
media = false

[plugin_settings."alexander/screen-toolkit"]
panel-full_open_near_click = true
panel-full_placement = "attached"
panel-mode = "compact"
panel_open_near_click = true
panel_placement = "attached"
screenshot-path = "~/scratch/Screenshots"
search-engine-url = "https://duckduckgo.com/?q="
selected-ocr-lang = "eng,esp"
video-path = "~/scratch/Screenrecord"

[plugin_settings."blackbartblues/audio-switcher"]
show_percentage = false

[plugin_settings."gustav0ar/drive-health"]
system_collector_enabled = true

[plugin_settings."noctalia/wallhaven"]
api_key = "jWfAvVISrkiLYKshUXrfwcv1fXiiXKuT"
download_dir = "~/Pictures/Wallpapers/Wallhaven"

[plugins]
enabled = [
    "noctalia/wallhaven",
    "whyoolw/sharednd",
    "apex077/eyecare",
    "alexander/screen-toolkit",
    "noctalia/world_clock",
    "gustav0ar/drive-health"
]

[shell]
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.keyboard_layout.custom_labels]
    "English (US, intl., with dead keys)" = "EN"

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "~/scratch/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Solarized"
mode = "auto"
source = "community"
wallpaper_scheme = "soft"

    [theme.templates]
    community_ids = [ "pywalfox-beta4" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/labellson/Pictures/Wallpapers/Wallhaven/wallhaven-6lpdjl.jpg"

    [wallpaper.last]
    path = "/home/labellson/Pictures/Wallpapers/Wallhaven/wallhaven-6lpdjl.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/labellson/Pictures/Wallpapers/Wallhaven/wallhaven-6lpdjl.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/labellson/Pictures/Wallpapers/Wallhaven/wallhaven-6lpdjl.jpg"

[widget.active_window]
max_length = 512
title_scroll = "on_hover"

[widget.audio_visualizer]
bands = 8
color_1 = "secondary"
color_2 = "#819500"
width = 32

[widget.battery]
icon_color = "#819500"

[widget.brightness]
icon_color = "primary"

[widget.cat]
audio_spectrum = true
enabled = false
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
anchor = false
capsule = false
tooltip_format = "{:%a %d %b}"

    [widget.clock.actions]
    right = "panel-toggle noctalia/world_clock:panel"

[widget.control-center]
enabled = false

[widget.cpu]
icon_color = "secondary"

[widget.input_volume]
mute_color = "secondary"

    [widget.input_volume.actions]
    middle = "exec pavucontrol"

[widget.keyboard_layout]
capsule = true
icon_color = "primary"

[widget.media]
capsule = true
capsule_border = "#819500"
hide_when_no_media = true
max_length = 160
title_scroll = "on_hover"

[widget.network]
show_label = false
show_vpn_label = true

[widget.privacy]
hide_inactive = true

[widget.ram]
icon_color = "#7D80D1"
stat = "ram_pct"

[widget.session]
color = "secondary"

[widget.summary]
type = "gustav0ar/drive-health:summary"

[widget.temp]
display = "gauge"
enabled = true
icon_color = "hover"

[widget.tray]
capsule = true

[widget.volume]
mute_color = "secondary"

    [widget.volume.actions]
    middle = "panel-toggle blackbartblues/audio-switcher:audio-switcher"

[widget.widget]
enabled = false
type = "blackbartblues/audio-switcher:widget"

    [widget.widget.actions]
    right = "volume-mute"

[widget.workspaces]
labels_only_when_occupied = true
