[bar]
order = [ "default" ]

    [bar.default]
    center = [ "control-center", "group:g2", "group:g6" ]
    end = [ "group:g3", "group:g4", "group:g1", "session" ]
    font_family = "GohuFont uni14 Nerd Font Mono"
    margin_ends = 0
    start = [ "wallpaper", "clipboard", "summary", "group:g5" ]

        [[bar.default.capsule_group]]
        border = "outline_variant"
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "brightness", "battery", "cpu", "ram", "temp", "keyboard_layout" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        border = "outline_variant"
        enabled = true
        fill = "surface_container"
        id = "g2"
        members = [ "clock", "privacy", "notifications" ]
        opacity = 1.0
        padding = 14.0

        [[bar.default.capsule_group]]
        border = ""
        enabled = true
        fill = "#2B90D8"
        foreground = "#FBF7EF"
        id = "g3"
        members = [ "tray", "network", "bluetooth" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        border = "secondary"
        enabled = true
        fill = "surface_container"
        id = "g4"
        members = [ "widget", "volume", "input_volume" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        border = "outline_variant"
        enabled = true
        fill = "surface_container"
        id = "g5"
        members = [ "workspaces", "active_window" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        border = "#819500"
        enabled = true
        fill = "surface_container"
        id = "g6"
        members = [ "cat", "media", "audio_visualizer" ]
        opacity = 1.0
        padding = 6.0

[battery]
warning_threshold = 15

[calendar]
enabled = true

    [calendar.account.abyssal_nextcloud]
    name = "Nextcloud"
    provider = "custom"
    type = "caldav"
    username = "labellson"

[control_center]
sidebar = "full"

    [control_center.calendar]
    show_events_location = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
theme_mode_changed = "[ $NOCTALIA_THEME_MODE = \"dark\" ] && darkman set dark || darkman set light"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
