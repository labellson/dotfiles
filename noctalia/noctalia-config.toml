[bar.default]
center = [ "control-center", "group:g2", "group:g6" ]
end = [ "group:g3", "group:g4", "group:g1", "session" ]
font_family = "GohuFont uni14 Nerd Font Mono"
margin_ends = 0
start = [ "wallpaper", "clipboard", "group:g5" ]

    [[bar.default.capsule_group]]
    border = "outline"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "brightness", "battery", "cpu", "ram", "temp", "keyboard_layout" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = "outline"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "clock", "privacy", "notifications" ]
    opacity = 1.0
    padding = 14.0

    [[bar.default.capsule_group]]
    border = ""
    enabled = true
    fill = "#2B90D8"
    foreground = "#FBF7EF"
    id = "g3"
    members = [ "tray", "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = "secondary"
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "volume", "input_volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = "outline"
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "workspaces", "active_window" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = "#819500"
    enabled = true
    fill = "surface_variant"
    id = "g6"
    members = [ "cat", "media", "audio_visualizer" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 15

[calendar]
enabled = true

    [calendar.account.abyssal_nextcloud]
    name = "Nextcloud"
    provider = "custom"
    server_url = "https://sputnik.dani.codes/remote.php/dav"
    type = "caldav"
    username = "labellson"

[control_center]
sidebar = "full"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
theme_mode_changed = "[ $NOCTALIA_THEME_MODE = \"dark\" ] && darkman set dark || darkman set light"

[location]
auto_locate = true

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true

[osd.kinds]
media = false

[plugin_settings."noctalia/wallhaven"]
api_key = "jWfAvVISrkiLYKshUXrfwcv1fXiiXKuT"
download_dir = "~/Pictures/Wallpapers/Wallhaven"

[plugins]
enabled = [ "noctalia/wallhaven", "whyoolw/sharednd", "noctalia/bongocat" ]

[shell]
password_style = "random"
screen_time_enabled = true

    [shell.panel]
    clipboard_placement = "attached"
    clipboard_position = "auto"
    open_near_click_clipboard = true
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "~/scratch/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Solarized"
mode = "auto"
source = "community"
wallpaper_scheme = "soft"

[wallpaper.default]
path = "/home/labellson/Pictures/Wallpapers/Wallhaven/wallhaven-6lpdjl.jpg"

[wallpaper.last]
path = "/home/labellson/Pictures/Wallpapers/Wallhaven/wallhaven-6lpdjl.jpg"

[wallpaper.monitors.DP-1]
path = "/home/labellson/Pictures/Wallpapers/Wallhaven/wallhaven-6lpdjl.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/labellson/Pictures/Wallpapers/Wallhaven/wallhaven-6lpdjl.jpg"

[widget.active_window]
max_length = 512
title_scroll = "on_hover"

[widget.audio_visualizer]
bands = 8
color_1 = "secondary"
color_2 = "#819500"
width = 32

[widget.battery]
icon_color = "#819500"

[widget.brightness]
icon_color = "primary"

[widget.cat]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
anchor = false
capsule = false
tooltip_format = "{:%a %d %b}"

[widget.control-center]
enabled = false

[widget.cpu]
icon_color = "secondary"

[widget.input_volume]
mute_color = "secondary"

[widget.keyboard_layout]
capsule = true
icon_color = "primary"

    [widget.keyboard_layout.custom_labels]
    "English (US, intl., with dead keys)" = "EN"

[widget.media]
capsule = true
capsule_border = "#819500"
hide_when_no_media = true
max_length = 160
title_scroll = "on_hover"

[widget.network]
show_label = false
show_vpn_label = true

[widget.privacy]
hide_inactive = true

[widget.ram]
icon_color = "#7D80D1"
stat = "ram_pct"

[widget.session]
color = "secondary"

[widget.temp]
display = "gauge"
enabled = true
icon_color = "hover"

[widget.tray]
capsule = true

[widget.volume]
mute_color = "secondary"

[widget.workspaces]
labels_only_when_occupied = true
